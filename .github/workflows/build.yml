name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signierschlüssel aus Secrets holen (falls vorhanden)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/scanner.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/scanner.keystore" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk YoutubeScanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YoutubeScanner
          path: YoutubeScanner.apk

      - name: Als Release veröffentlichen (Download aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YouTube Scanner ${{ github.run_number }}
          files: YoutubeScanner.apk
          make_latest: true
