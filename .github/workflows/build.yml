name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Fester Signierschlüssel, damit Updates einfach über die alte Version
      # installiert werden können (Daten und Freigaben bleiben erhalten).
      # Er wird einmal erzeugt und im privaten Actions-Cache dieses Repos gehalten.
      - name: Signierschlüssel aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: ~/.scanner-signing
          key: scanner-signing-v1

      - name: Signierschlüssel erzeugen (nur beim ersten Mal)
        run: |
          mkdir -p ~/.scanner-signing
          if [ ! -f ~/.scanner-signing/scanner.keystore ]; then
            head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' > ~/.scanner-signing/pass
            keytool -genkeypair -keystore ~/.scanner-signing/scanner.keystore -alias scanner \
              -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass "$(cat ~/.scanner-signing/pass)" -keypass "$(cat ~/.scanner-signing/pass)" \
              -dname "CN=YouTube Scanner, C=DE"
          fi
          echo "SIGNING_KEYSTORE_PATH=$HOME/.scanner-signing/scanner.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat ~/.scanner-signing/pass)"
          echo "SIGNING_PASSWORD=$(cat ~/.scanner-signing/pass)" >> "$GITHUB_ENV"

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk YoutubeScanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YoutubeScanner
          path: YoutubeScanner.apk

      - name: Als Release veröffentlichen (Download aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YouTube Scanner ${{ github.run_number }}
          files: YoutubeScanner.apk
          make_latest: true
